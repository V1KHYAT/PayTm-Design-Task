<svg viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; max-height: 300px; display: block; margin: 0 auto;">
  <defs>
    <linearGradient id="d1Light" x1="60" y1="170" x2="480" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f5f4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ebebe8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="d2Light" x1="480" y1="170" x2="900" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef2f2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fee2e2" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Diamond 1 Background Fill -->
  <polygon points="70,170 270,35 470,170 270,305" fill="url(#d1Light)" stroke="#18181b" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.25" />
  
  <!-- Diamond 2 Background Fill -->
  <polygon points="490,170 690,35 890,170 690,305" fill="url(#d2Light)" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.25" />

  <!-- Center Horizontal Baseline -->
  <line x1="50" y1="170" x2="910" y2="170" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="2 4" />

  <!-- Diamond 1 Solid Edges -->
  <polyline points="70,170 270,35 470,170" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="70,170 270,305 470,170" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diamond 2 Solid Edges -->
  <polyline points="490,170 690,35 890,170" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="490,170 690,305 890,170" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diamond Headers / Stages -->
  <g font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" text-anchor="middle">
    <rect x="195" y="8" width="150" height="22" rx="11" fill="#fff" stroke="#18181b" stroke-width="1" />
    <text x="270" y="23" fill="#18181b">1. DISCOVER &amp; DEFINE</text>
    
    <rect x="615" y="8" width="150" height="22" rx="11" fill="#fff" stroke="#dc2626" stroke-width="1" />
    <text x="690" y="23" fill="#dc2626">2. DEVELOP &amp; DELIVER</text>
  </g>

  <!-- Widening / Convergence Markers -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.08em">
    <text x="170" y="158" fill="#71717a" text-anchor="middle">WIDENING ↗</text>
    <text x="370" y="158" fill="#71717a" text-anchor="middle">CONVERGING ↘</text>
    <text x="590" y="158" fill="#dc2626" text-anchor="middle" fill-opacity="0.8">WIDENING ↗</text>
    <text x="790" y="158" fill="#dc2626" text-anchor="middle" fill-opacity="0.8">CONVERGING ↘</text>
  </g>

  <!-- PHASE 1: Sense intent -->
  <g transform="translate(95, 120)">
    <circle cx="0" cy="0" r="14" fill="#fff" stroke="#18181b" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#18181b" text-anchor="middle">01</text>
    <text x="0" y="-22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Sense intent</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#71717a" text-anchor="middle">Deconstruct prompt</text>
  </g>

  <!-- PHASE 2: Know context -->
  <g transform="translate(230, 80)">
    <circle cx="0" cy="0" r="14" fill="#fff" stroke="#18181b" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#18181b" text-anchor="middle">02</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Know context</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#71717a" text-anchor="middle">Hero chaos &amp; distress</text>
  </g>

  <!-- PHASE 3: Know people -->
  <g transform="translate(250, 240)">
    <circle cx="0" cy="0" r="14" fill="#fff" stroke="#18181b" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#18181b" text-anchor="middle">03</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Know people</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#71717a" text-anchor="middle">Panicked civilians</text>
  </g>

  <!-- PHASE 4: Frame insights (Converge point) -->
  <g transform="translate(480, 170)">
    <circle cx="0" cy="0" r="18" fill="#18181b" stroke="#18181b" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">04</text>
    <rect x="-65" y="-55" width="130" height="24" rx="12" fill="#18181b" />
    <text x="0" y="-39" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Frame insights</text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#dc2626" text-anchor="middle">Panic-first pivot</text>
  </g>

  <!-- PHASE 5: Explore concepts -->
  <g transform="translate(630, 80)">
    <circle cx="0" cy="0" r="14" fill="#fff" stroke="#dc2626" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">05</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Explore concepts</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#71717a" text-anchor="middle">1-tap vs category triage</text>
  </g>

  <!-- PHASE 6: Frame solution -->
  <g transform="translate(710, 240)">
    <circle cx="0" cy="0" r="14" fill="#fff" stroke="#dc2626" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">06</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Frame solution</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#71717a" text-anchor="middle">Immediate dispatch + updates</text>
  </g>

  <!-- PHASE 7: Realise offer (Final convergent delivery) -->
  <g transform="translate(865, 170)">
    <circle cx="0" cy="0" r="16" fill="#dc2626" stroke="#dc2626" stroke-width="2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">07</text>
    <rect x="-55" y="-52" width="110" height="24" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5" />
    <text x="0" y="-36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">Realise offer</text>
    <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#18181b" text-anchor="middle">Harbor Prototype</text>
  </g>
</svg>