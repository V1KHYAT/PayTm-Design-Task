<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harbor — Updates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .updates-container {
            padding: 4cqh 6cqw;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .status-badge {
            background: rgba(34,197,94,0.2);
            color: rgb(34,197,94);
            padding: 1cqh 3cqw;
            border-radius: 5cqh;
            font-size: 1.6cqh;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 3cqh;
            align-self: flex-start;
        }
        .worse-btn {
            background: var(--surface-variant);
            color: var(--text-primary);
            border: 2px solid rgb(216,59,48);
            border-radius: 1.5cqh;
            padding: 2cqh;
            font-size: 2cqh;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
            margin-bottom: 2cqh;
            transition: background 0.2s;
        }
        .worse-btn:active {
            background: var(--surface-active);
        }
    </style>
</head>
<body>
    <div class="phone dark-mode">

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
                <svg viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="6" width="3" height="6" rx="0.5" fill="rgb(3,4,3)"/>
                    <rect x="4.5" y="4" width="3" height="8" rx="0.5" fill="rgb(3,4,3)"/>
                    <rect x="9" y="2" width="3" height="10" rx="0.5" fill="rgb(3,4,3)"/>
                    <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="rgb(3,4,3)"/>
                </svg>
                <svg viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 3C10.2 3 12.2 3.9 13.6 5.4L15 4C13.2 2.1 10.7 1 8 1C5.3 1 2.8 2.1 1 4L2.4 5.4C3.8 3.9 5.8 3 8 3Z" fill="rgb(3,4,3)"/>
                    <path d="M8 6C9.4 6 10.6 6.6 11.5 7.5L12.9 6.1C11.6 4.8 9.9 4 8 4C6.1 4 4.4 4.8 3.1 6.1L4.5 7.5C5.4 6.6 6.6 6 8 6Z" fill="rgb(3,4,3)"/>
                    <circle cx="8" cy="10.5" r="1.5" fill="rgb(3,4,3)"/>
                </svg>
                <svg viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="rgb(3,4,3)" stroke-opacity="0.35"/>
                    <rect x="2" y="2" width="17" height="8" rx="2" fill="rgb(3,4,3)"/>
                    <path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 5.5C24.5 4.6 23.8 3.8 23 4.5Z" fill="rgb(3,4,3)" fill-opacity="0.4"/>
                </svg>
            </div>
        </div>

        <div class="updates-container">
            <h2 class="large-title" style="text-align: left; font-size: 3.5cqh;">Updates</h2>
            <div class="status-badge">Help Dispatched</div>
            
            <div id="updatesList">
                <div class="tatsumaki-card" style="border-left-color: rgb(34,197,94);">
                    <div style="font-weight: 700; font-size: 1.8cqh; margin-bottom: 0.5cqh;">Fire details received</div>
                    <div style="font-size: 1.5cqh; color: var(--text-secondary);">First responders have your information.</div>
                </div>
            </div>

            <button class="worse-btn" id="worseBtn">Things are getting worse</button>
        </div>

        <!-- Home Indicator -->
        <div class="home-bar">
            <div class="home-indicator"></div>
        </div>

    </div>

    <script>
        document.getElementById('worseBtn').addEventListener('click', function() {
            this.style.display = 'none';
            
            const updatesList = document.getElementById('updatesList');
            const newCard = document.createElement('div');
            newCard.className = 'tatsumaki-card';
            newCard.innerHTML = `
                <div style="font-weight: 700; font-size: 1.8cqh; margin-bottom: 0.5cqh; color: rgb(216,59,48);">Escalation Sent</div>
                <div style="font-size: 1.5cqh; color: var(--text-secondary);">Emergency services notified of worsening situation.</div>
            `;
            updatesList.appendChild(newCard);

            setTimeout(() => {
                window.location.href = 'safe.html';
            }, 3000);
        });
    </script>
</body>
</html>
