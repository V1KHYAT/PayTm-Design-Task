<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harbor — SOS App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">

        <!-- Status Bar — 5.75cqh -->
        <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
                <svg viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="6" width="3" height="6" rx="0.5" fill="rgb(3,4,3)"/>
                    <rect x="4.5" y="4" width="3" height="8" rx="0.5" fill="rgb(3,4,3)"/>
                    <rect x="9" y="2" width="3" height="10" rx="0.5" fill="rgb(3,4,3)"/>
                    <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="rgb(3,4,3)"/>
                </svg>
                <svg viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 3C10.2 3 12.2 3.9 13.6 5.4L15 4C13.2 2.1 10.7 1 8 1C5.3 1 2.8 2.1 1 4L2.4 5.4C3.8 3.9 5.8 3 8 3Z" fill="rgb(3,4,3)"/>
                    <path d="M8 6C9.4 6 10.6 6.6 11.5 7.5L12.9 6.1C11.6 4.8 9.9 4 8 4C6.1 4 4.4 4.8 3.1 6.1L4.5 7.5C5.4 6.6 6.6 6 8 6Z" fill="rgb(3,4,3)"/>
                    <circle cx="8" cy="10.5" r="1.5" fill="rgb(3,4,3)"/>
                </svg>
                <svg viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="rgb(3,4,3)" stroke-opacity="0.35"/>
                    <rect x="2" y="2" width="17" height="8" rx="2" fill="rgb(3,4,3)"/>
                    <path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 5.5C24.5 4.6 23.8 3.8 23 4.5Z" fill="rgb(3,4,3)" fill-opacity="0.4"/>
                </svg>
            </div>
        </div>

        <!-- Header (Brand + Menu) — 10.85cqh -->
        <header class="app-header">
            <h1 class="app-title">Harbor</h1>
            <button class="menu-btn" aria-label="Menu">
                <svg viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect y="0" width="24" height="2.5" rx="1.25" fill="rgb(3,4,3)"/>
                    <rect y="7.75" width="24" height="2.5" rx="1.25" fill="rgb(3,4,3)"/>
                    <rect y="15.5" width="24" height="2.5" rx="1.25" fill="rgb(3,4,3)"/>
                </svg>
            </button>
        </header>

        <!-- Fixed spacer: Figma gap between header and cards -->
        <div class="spacer"></div>

        <!-- Action Cards — Figma: 28.15cqh tall section -->
        <div class="cards-section">

            <div class="action-card">
                <div class="card-icon-box">
                    <!-- Open Book — matches Figma Guide icon -->
                    <svg viewBox="0 0 64 54" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M32 10C28 6 21 4 14 4C9 4 4.5 5.2 2 7V46C4.5 44.8 9 43.5 14 43.5C21 43.5 28 46 32 50M32 10V50M32 10C36 6 43 4 50 4C55 4 59.5 5.2 62 7V46C59.5 44.8 55 43.5 50 43.5C43 43.5 36 46 32 50" stroke="rgb(3,4,3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="card-text">
                    <h2>What to do if...</h2>
                    <p>Quick guides for common situations.</p>
                </div>
                <svg class="card-chevron" viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L7 7L1 13" stroke="rgb(3,4,3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="action-card">
                <div class="card-icon-box">
                    <!-- Document with lines — matches Figma Report icon -->
                    <svg viewBox="0 0 50 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="46" height="56" rx="7" stroke="rgb(3,4,3)" stroke-width="4"/>
                        <line x1="12" y1="20" x2="38" y2="20" stroke="rgb(3,4,3)" stroke-width="4" stroke-linecap="round"/>
                        <line x1="12" y1="31" x2="38" y2="31" stroke="rgb(3,4,3)" stroke-width="4" stroke-linecap="round"/>
                        <line x1="12" y1="42" x2="28" y2="42" stroke="rgb(3,4,3)" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="card-text">
                    <h2>Report a problem</h2>
                    <p>Describe what you see.</p>
                </div>
                <svg class="card-chevron" viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L7 7L1 13" stroke="rgb(3,4,3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

        </div>

        <!-- SOS — Figma: fills remaining height, card is 33.3cqh -->
        <div class="sos-section">
            <div class="sos-card">
                <span class="sos-title">SOS</span>
                <span class="sos-sub">PRESS TO REQUEST HELP</span>
            </div>
        </div>

        <!-- Home Indicator — Figma: 8.08cqh area -->
        <div class="home-bar">
            <div class="home-indicator"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
